name: build

# Manual only: Actions → build → "Run workflow", or `gh workflow run build.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    needs: wasm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint + type-check
        run: make check

      # Bundled for the self-install (src/sim/bridge-install.ts).
      - uses: actions/download-artifact@v8
        with:
          name: fs24-streamdeck-bridge
          path: com.robertw.fs24.sdPlugin/bridge/

      # The Stream Deck app only replaces an installed plugin when the version
      # changes → x.y.z from the manifest, run number as 4th part.
      - name: Package
        run: |
          base=$(node -p "require('./com.robertw.fs24.sdPlugin/manifest.json').Version.split('.').slice(0, 3).join('.')")
          make package PLUGIN_VERSION="$base.${{ github.run_number }}"

      - uses: actions/upload-artifact@v7
        with:
          name: com.robertw.fs24.streamDeckPlugin
          path: com.robertw.fs24.streamDeckPlugin
          if-no-files-found: error
          retention-days: 30

  # Release build of the WASM bridge with Asobo's own LLVM from the SDK
  # (Windows binaries) — stock LLVM builds are not loadable by the sim.
  wasm:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve SDK version
        id: sdk
        run: |
          v=$(curl -sSfL https://sdk.flightsimulator.com/msfs2024/files/sdk.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).game_versions[0].release_notes[0]))')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # SDK files stay in the private Actions cache; they are never committed or uploaded.
      - uses: actions/cache@v6
        with:
          path: sdk/${{ steps.sdk.outputs.version }}
          key: msfs2024-sdk-windows-${{ steps.sdk.outputs.version }}

      - run: scripts/fetch-sdk.sh

      - name: Build bridge package
        env:
          SDK_DIR: ../sdk/${{ steps.sdk.outputs.version }}
          TOOLCHAIN: sdk
        run: |
          wasm/build.sh
          npx --no-install tsx scripts/build-bridge-package.ts

      - uses: actions/upload-artifact@v7
        with:
          name: fs24-streamdeck-bridge
          path: wasm/out/
          if-no-files-found: error
          retention-days: 7
