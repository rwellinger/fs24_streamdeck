name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint + type-check
        run: make check

      - name: Package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: com.robertw.fs24.streamDeckPlugin
          path: com.robertw.fs24.streamDeckPlugin
          if-no-files-found: error
          retention-days: 30
