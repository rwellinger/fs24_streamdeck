<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>MSFS Variable Lamp</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="sim-pi-helpers.js"></script>
		<style>
			.live { font-family: monospace; font-size: 11px; color: #9a9; word-break: break-all; }
			.live[data-state="not-found"], .live[data-state="error"] { color: #d97; }
			.live[data-state="offline"] { color: #888; }
			.hint { color: #888; font-size: 11px; margin: 0 12px 8px; }
		</style>
	</head>
	<body>
		<sdpi-item label="Variable">
			<sdpi-textfield setting="varPath" id="varField" placeholder="A:GENERAL ENG STARTER ACTIVE:1, Bool" required></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="">
			<span class="live" id="varFieldLive"></span>
		</sdpi-item>
		<div class="hint">
			<code>A:NAME[:index], unit</code> · <code>L:name[, unit]</code> · <code>B:name</code> —
			e.g. <code>A:LIGHT STROBE, Bool</code>, <code>B:FUEL_PUMP</code>
		</div>
		<sdpi-item label="Value ON">
			<sdpi-textfield setting="valueOn" placeholder="1"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Color">
			<sdpi-select setting="color" default="green">
				<option value="green">Green</option>
				<option value="blue">Blue</option>
				<option value="yellow">Yellow</option>
				<option value="orange">Orange</option>
				<option value="red">Red</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Label">
			<sdpi-textfield setting="label" placeholder="e.g. STARTER"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Label position">
			<sdpi-select setting="labelPosition" default="top">
				<option value="top">Top</option>
				<option value="bottom">Bottom</option>
			</sdpi-select>
		</sdpi-item>

		<details>
			<summary>SimConnect connection (all buttons)</summary>
			<sdpi-item label="Sim host">
				<sdpi-textfield setting="simHost" global placeholder="empty = this PC (local)"></sdpi-textfield>
			</sdpi-item>
			<sdpi-item label="Port">
				<sdpi-textfield setting="simPort" global placeholder="500" pattern="[0-9]*"></sdpi-textfield>
			</sdpi-item>
		</details>
		<script>
			SimPI.attachBridgeInstaller();
			SimPI.attachProbe("varField", "varFieldLive");
		</script>
	</body>
</html>
