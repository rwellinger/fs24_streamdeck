<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>MSFS Command</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<script src="sim-pi-helpers.js"></script>
		<style>
			.live { font-family: monospace; font-size: 11px; color: #9a9; word-break: break-all; }
			.live[data-state="not-found"], .live[data-state="error"] { color: #d97; }
			.live[data-state="offline"] { color: #888; }
			.hint { color: #888; font-size: 11px; margin: 0 12px 8px; }
		</style>
	</head>
	<body>
		<sdpi-item label="Event">
			<sdpi-textfield setting="eventName" id="eventField" placeholder="e.g. TOGGLE_NAV_LIGHTS, H:NAME, RPN:code" required></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="">
			<span class="live" id="eventFieldLive"></span>
		</sdpi-item>
		<div class="hint"><code>K:NAME</code> (prefix optional), <code>H:NAME</code> or <code>RPN:code</code> — H: and RPN: need the WASM bridge in the sim.</div>
		<sdpi-item label="Value">
			<sdpi-textfield setting="eventValue" placeholder="K: only, optional, default 0" pattern="-?[0-9]*"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Auto-Repeat">
			<sdpi-checkbox setting="autoRepeat" label="Repeat at 5 Hz while held (after 500 ms)"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Feedback">
			<sdpi-checkbox setting="hideConfirmation" label="Hide green confirmation icon on success"></sdpi-checkbox>
		</sdpi-item>

		<details>
			<summary>SimConnect connection (all buttons)</summary>
			<sdpi-item label="Sim host">
				<sdpi-textfield setting="simHost" global placeholder="empty = this PC (local)"></sdpi-textfield>
			</sdpi-item>
			<sdpi-item label="Port">
				<sdpi-textfield setting="simPort" global placeholder="500" pattern="[0-9]*"></sdpi-textfield>
			</sdpi-item>
		</details>
		<script>
			SimPI.attachBridgeInstaller();
			SimPI.attachProbe("eventField", "eventFieldLive", "event");
		</script>
	</body>
</html>
